name: Weekly link check
run-name: Checking report links

on:
  schedule:
    # Mondays at 07:00 UTC. Note that GitHub disables scheduled workflows in
    # repositories with no activity for 60 days; see docs/DEPLOYMENT.md.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  ISSUE_LABEL: link-check
  ISSUE_TITLE: "Broken links found in reports"

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install Tiredize
      run: pip install -r .tiredize/requirements.txt

    # Only reports are checked. docs/examples contains deliberately fake
    # placeholder URLs and would always fail.
    - name: Check links in reports
      id: check
      run: |
        reports=$(find reports -name README.md | sort)

        if [ -z "${reports}" ]; then
          echo "No reports to check."
          echo "failed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Tiredize exits nonzero when it finds problems, which is not a
        # failure of this job -- we report findings rather than crashing on
        # them.
        set +e
        tiredize --rules .tiredize/rules-links.yaml ${reports} > tiredize.out 2>&1
        set -e

        grep '\[links\]' tiredize.out > failures.txt || true

        if [ -s failures.txt ]; then
          echo "failed=true" >> "$GITHUB_OUTPUT"
          echo "count=$(wc -l < failures.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "Unreachable links found:"
          cat failures.txt
        else
          echo "failed=false" >> "$GITHUB_OUTPUT"
          echo "All links reachable."
        fi

    # A single long-lived issue is reused rather than filing a new one every
    # week, so one broken link does not become 52 open issues.
    - name: Open or update the tracking issue
      if: steps.check.outputs.failed == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COUNT: ${{ steps.check.outputs.count }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        # The label must exist before it can be applied.
        gh label create "$ISSUE_LABEL" \
          --description "Automated weekly link check" \
          --color "d93f0b" 2>/dev/null || true

        {
          echo "The weekly link check found ${COUNT} unreachable link(s) in \`reports/\`."
          echo
          echo "Last checked: $(date -u '+%Y-%m-%d %H:%M UTC') ([run log](${RUN_URL}))"
          echo
          echo '```text'
          cat failures.txt
          echo '```'
          echo
          echo "Sites that return 403 or 429 to automated requests are already"
          echo "treated as reachable, so these are more likely to be genuine."
          echo "Transient network failures are still possible; if a link looks"
          echo "fine when you open it, re-run the check from the Actions tab."
          echo
          echo "This issue is maintained automatically. Its body is rewritten"
          echo "on each run, and it closes itself once every link resolves."
        } > issue-body.md

        existing=$(gh issue list \
          --label "$ISSUE_LABEL" \
          --state all \
          --limit 1 \
          --json number,state \
          --jq '.[0] // empty')

        if [ -n "${existing}" ]; then
          number=$(echo "${existing}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["number"])')
          state=$(echo "${existing}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["state"])')

          if [ "${state}" = "CLOSED" ]; then
            gh issue reopen "${number}"
          fi

          gh issue edit "${number}" --body-file issue-body.md
          echo "Updated issue #${number}"
        else
          gh issue create \
            --title "$ISSUE_TITLE" \
            --label "$ISSUE_LABEL" \
            --body-file issue-body.md
        fi

    - name: Close the tracking issue
      if: steps.check.outputs.failed == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        number=$(gh issue list \
          --label "$ISSUE_LABEL" \
          --state open \
          --limit 1 \
          --json number \
          --jq '.[0].number // empty')

        if [ -n "${number}" ]; then
          gh issue close "${number}" \
            --comment "All report links resolved on the latest check. Closing automatically."
          echo "Closed issue #${number}"
        else
          echo "No open link-check issue to close."
        fi
